<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rill or Fejk?</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
    background: rgb(98, 203, 255);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.phone {
    width: 350px;
    height: 700px;
    background: rgb(98, 203, 255);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

    h1 {
        text-align: center;
        font-size: 28px;
        margin: 20px 0;
        color: white;
        font-weight: 900;
    }

    /* IMAGE */
    .image-container {
        width: 100%;
        height: 350px;
        position: relative;
        overflow: hidden;
    }

    .image-half {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;

        /* Slower slicing */
        transition: transform 2.5s ease;
    }

    #topHalf {
        clip-path: inset(0 0 50% 0);
    }

    #bottomHalf {
        clip-path: inset(50% 0 0 0);
    }

    /* SLICING */
    .sliced #topHalf {
        transform: translateY(-250px) rotate(-10deg);
    }

    .sliced #bottomHalf {
        transform: translateY(250px) rotate(10deg);
    }

    /* BUTTONS */
    .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
    }

    button {
        border: none;
        border-radius: 15px;
        padding: 18px;
        font-size: 20px;
        cursor: pointer;
        background: #3a53c4;
        transition: 0.2s;
    }

    button {
        color: white;
        font-weight: 900;
        background: #333;
    }

    button:hover {
        transform: scale(1.03);
        background: #61fd7b;
    }

    #cakeButton {
        background: #3ab9c4;
    }

    /* POPUP MESSAGE */
    #message {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        min-height: 35px;
        font-weight: 900;
    }

    /* WRONG */
    .wrong {
        animation: shake 0.4s;
        background: #ff0000 !important;
    }

    @keyframes shake {
        0% {
            transform: translateX(0);
        }

        25% {
            transform: translateX(-10px);
        }

        50% {
            transform: translateX(10px);
        }

        75% {
            transform: translateX(-10px);
        }

        100% {
            transform: translateX(0);
        }
    }

    /* CORRECT POPUP */
    .correct {
        color: #00aa00;
        animation: popup 0.5s;
    }

    @keyframes popup {
        0% {
            transform: scale(0);
        }

        80% {
            transform: scale(1.2);
        }

        100% {
            transform: scale(1);
        }
    }
</style>

</head>

<body>

<div class="phone">

    <div class="notch"></div>

    <h1>Real or Fake?</h1>

    <div class="image-container" id="imageContainer">

        <!-- YOUR IMAGE -->
        <img
            id="topHalf"
            class="image-half"
            src="Trevor.jpeg"
        >

        <img
            id="bottomHalf"
            class="image-half"
            src="Trevor.jpeg"
        >

    </div>

    <div class="buttons">

        <button id="realButton">
            Rill?💯
        </button>

        <button id="fakeButton">
            Fejk?💯
        </button>

        <button id="cakeButton">
            Cake?✅
        </button>

        <div id="message"></div>

    </div>

</div>

<script>

    const realButton =
        document.getElementById("realButton");

    const fakeButton =
        document.getElementById("fakeButton");

    const cakeButton =
        document.getElementById("cakeButton");

    const imageContainer =
        document.getElementById("imageContainer");

    const message =
        document.getElementById("message");

    let finished = false;

    const wrongSound = new Audio("wrong.mp3");
    const correctSound = new Audio("correct.mp3");

    wrongSound.volume = 0.7;
    correctSound.volume = 0.7;


    /* WRONG ANSWER */

    function wrongAnswer(button) {

        if (finished) return;

        button.classList.add("wrong");

        message.classList.remove("correct");

        message.textContent = "asi ne";

        wrongSound.currentTime = 0;
        wrongSound.play();


        setTimeout(() => {

            button.classList.remove("wrong");

        }, 400);
    }


    /* REAL */

    realButton.addEventListener("click", () => {

        wrongAnswer(realButton);

    });


    /* FAKE */

    fakeButton.addEventListener("click", () => {

        wrongAnswer(fakeButton);

    });


    /* CAKE */

    cakeButton.addEventListener("click", () => {

        if (finished) return;

        finished = true;

        correctSound.currentTime = 0;
        correctSound.play();    


        /* GREEN POPUP */

        message.textContent = "jessss";

        message.classList.add("correct");


        /* SLICE IMAGE */

        imageContainer.classList.add("sliced");


        /* DISABLE EVERYTHING */

        realButton.disabled = true;

        fakeButton.disabled = true;

        cakeButton.disabled = true;

        realButton.style.cursor = "default";

        fakeButton.style.cursor = "default";

        cakeButton.style.cursor = "default";

    });

</script>

</body>

</html>
